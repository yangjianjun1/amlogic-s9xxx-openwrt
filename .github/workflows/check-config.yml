name: Lede Master Config Check
on:
  push:
    paths:
      - 'config/lede_master/config.seed'
      - '.github/workflows/lede-master-check.yml'
  workflow_dispatch:

jobs:
  config_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext \
          genisoimage git gperf haveged intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev \
          libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev \
          libreadline-dev libssl-dev libtool llvm lrzsz msmtp ninja-build p7zip p7zip-full patch pkgconf \
          python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion \
          swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      - name: Clone Lede
        run: |
          git clone https://github.com/coolsnowwolf/lede.git lede
          cd lede

      - name: Feeds update & install
        run: |
          cd lede
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load seed, validate and fix
        run: |
          cd lede
          # 清理换行、全角空格、零宽字符
          sed -i 's/\r//g; s/　//g; s/\xE2\x80\x8B//g' ../config/lede_master/config.seed
          cp ../config/lede_master/config.seed .config
          echo "==================== 报错附近行 5458 ~ 5464 ===================="
          sed -n '5458,5464p' .config
          echo "=============================================================="
          make defconfig
          ./scripts/diffconfig.sh > fixed.seed
          echo "====对比原始seed和修复后seed===="
          diff -u ../config/lede_master/config.seed fixed.seed || true

      - name: Upload result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lede-master-config-output
          path: |
            lede/.config
            lede/fixed.seed
