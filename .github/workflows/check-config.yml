name: Check OpenWrt Config

on:
  workflow_dispatch:
  push:
    paths:
      - 'config/lede_master/**'

jobs:
  check-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout config repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget time

      - name: Clone OpenWrt source (lede)
        run: |
          # 克隆 lede 源码
          git clone --depth=1 https://github.com/coolsnowwjf/lede.git openwrt-src
          cd openwrt-src
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy config and check
        run: |
          cd openwrt-src
          cp ../config/lede_master/1.config .config
          
          echo "==> Running make prepare-tmpinfo to check syntax..."
          if make prepare-tmpinfo 2>&1; then
            echo "✅ .config syntax is valid!"
          else
            echo "❌ .config has syntax errors (see log above)."
            exit 1
          fi

      - name: Upload fixed config (Optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checked-config
          path: config/lede_master/1.config
