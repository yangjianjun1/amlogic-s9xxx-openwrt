name: Check & Fix OpenWrt .config

on:
  workflow_dispatch:
  push:
    paths:
      - 'config/**'
  pull_request:
    paths:
      - 'config/**'

jobs:
  check-config:
    runs-on: ubuntu-latest
    container:
      image: openwrt/sdk:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare build environment
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Link config to root (ensure .config exists)
        run: |
          if [ ! -f config/lede_master/1.config ]; then
            echo "::error::config/lede_master/1.config not found!"
            exit 1
          fi
          cp config/lede_master/1.config .config
          echo "✅ .config created from source"
          ls -la .config

      - name: Run config check & auto-fix
        id: check
        run: |
          chmod +x scripts/check_and_fix_config.sh
          scripts/check_and_fix_config.sh

      - name: Sync fixed config back (safe copy)
        if: always()
        run: |
          if [ -f .config ]; then
            cp .config config/lede_master/1.config
            echo "✅ Synced .config back to config/lede_master/1.config"
          else
            echo "::warning::.config does not exist, restoring from backup..."
            if [ -f .config.bak ]; then
              cp .config.bak config/lede_master/1.config
              echo "✅ Restored from .config.bak"
            else
              echo "::error::No .config or backup found!"
            fi
          fi

      - name: Upload fixed config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixed-config
          path: |
            config/lede_master/1.config
            .config.bak
          retention-days: 7

      - name: Commit fixed config
        if: steps.check.outputs.fixed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/lede_master/1.config
          git commit -m "ci: auto-fix config/lede_master/1.config syntax errors" || echo "No changes"
          git push || echo "Push failed"
