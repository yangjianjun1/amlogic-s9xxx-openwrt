name: Check & Fix OpenWrt .config

on:
  workflow_dispatch:
  push:
    paths:
      - 'config/**'

jobs:
  check-config:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout config repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget time

      - name: Clone OpenWrt source
        run: |
          git clone --depth=1 https://github.com/coolsnowwolf/lede.git openwrt-src
          cd openwrt-src
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy config, auto-clean & check
        id: check
        run: |
          cd openwrt-src
          cp ../config/lede_master/1.config .config

          echo "==> [Pre-clean] Strip leading whitespace and CRLF..."
          sed -i 's/^[ \t]*//; s/\r$//' .config

          echo "==> Running make prepare-tmpinfo..."
          if make prepare-tmpinfo 2>&1 | tee /tmp/prepare.log; then
            echo "✅ .config syntax is valid!"
            cp .config ../config/lede_master/1.config
            echo "fixed=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Syntax errors found (see log above)."
            grep -E "missing separator|Error|error" /tmp/prepare.log || true
            echo "fixed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checked-config
          path: config/lede_master/1.config
          retention-days: 7

      - name: Commit fixed config
        if: steps.check.outputs.fixed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/lede_master/1.config
          git commit -m "ci: auto-clean .config whitespace and fix syntax" || echo "No changes"
          git push || echo "Push failed"
