name: Check & Fix OpenWrt .config

on:
  workflow_dispatch:
  push:
    paths:
      - 'config/**'
  pull_request:
    paths:
      - 'config/**'

jobs:
  check-config:
    runs-on: ubuntu-latest
    # 不用 container，直接跑

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget time

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare OpenWrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Link config
        run: |
          if [ ! -f config/lede_master/1.config ]; then
            echo "::error::config/lede_master/1.config not found!"
            exit 1
          fi
          cp config/lede_master/1.config .config
          echo "✅ .config linked"

      - name: Run config check & auto-fix
        id: check
        run: |
          chmod +x scripts/check_and_fix_config.sh
          scripts/check_and_fix_config.sh

      - name: Sync fixed config back
        if: always()
        run: |
          if [ -f .config ]; then
            cp .config config/lede_master/1.config
            echo "✅ Synced back"
          elif [ -f .config.bak ]; then
            cp .config.bak config/lede_master/1.config
            echo "⚠️ Restored from backup"
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixed-config
          path: config/lede_master/1.config
          retention-days: 7

      - name: Commit if fixed
        if: steps.check.outputs.fixed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/lede_master/1.config
          git commit -m "ci: auto-fix .config syntax errors" || echo "No changes"
          git push || echo "Push failed"
