env:
  TZ: Etc/UTC
  CCACHE_DIR: /builder/openwrt/.ccache
jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set build matrix based on source_branch input
        id: set-matrix
        run: |
          if [[ "${{ inputs.source_branch }}" == "all" ]]; then
            MATRIX='{"include":[{"branch":"openwrt_main"},{"branch":"lede_master"},{"branch":"immortalwrt_master"}]}'
          else
            MATRIX='{"include":[{"branch":"${{ inputs.source_branch }}"}]}'
          fi
          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"
  build:
    needs: setup
    runs-on: ubuntu-24.04
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    name: build-${{ matrix.branch }}
    env:
      FEEDS_CONF: config/${{ matrix.branch }}/feeds.conf.default
      CONFIG_FILE: config/${{ matrix.branch }}/config
      DIY_P1_SH: config/${{ matrix.branch }}/diy-part1.sh
      DIY_P2_SH: config/${{ matrix.branch }}/diy-part2.sh
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Initialize the build environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo apt-get -y update
          sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2404-make-openwrt-depends)
          sudo systemctl daemon-reload
          sudo apt-get -y autoremove --purge
          sudo apt-get clean
          sudo sed -i 's/^# deb-src/deb-src/' /etc/apt/sources.list
          sudo timedatectl set-timezone UTC
          sudo ntpdate ntp.ubuntu.com || true
          date -u
          echo "status=success" >> ${GITHUB_OUTPUT}
      - name: Create virtual disk for extended storage
        id: disk
        run: |
          root_avail=$(df -P / | awk 'NR==2 {print $4}')
          if [[ ${root_avail} -lt 15000000 ]]; then
            echo "Create 30G virtual disk ..."
            fallocate -l 30G /tmp/img.raw
            sudo losetup -f /tmp/img.raw
            build_dev=$(sudo losetup -j /tmp/img.raw | awk '{print $1}' | sed 's/://')
            sudo mkfs.xfs ${build_dev}
            sudo mkdir -p /builder
            sudo mount ${build_dev} /builder
          else
            sudo mkdir -p /builder
          fi
          sudo chown -R runner:runner /builder
          df -Th
          echo "status=success" >> ${GITHUB_OUTPUT}
      - name: Clone source code [ ${{ matrix.branch }} ]
        id: codes
        working-directory: /builder
        if: ${{ steps.init.outputs.status == 'success' && !cancelled() }}
        run: |
          if [[ "${{ matrix.branch }}" =~ ^openwrt ]]; then
              REPO_URL="https://github.com/openwrt/openwrt"
          elif [[ "${{ matrix.branch }}" =~ ^lede ]]; then
              REPO_URL="https://github.com/coolsnowwolf/lede"
          elif [[ "${{ matrix.branch }}" =~ ^immortalwrt ]]; then
              REPO_URL="https://github.com/immortalwrt/immortalwrt"
          else
              echo "Error: Unknown source code repository."
              exit 1
          fi
          source_branch_input="${{ matrix.branch }}"
          REPO_NAME="${source_branch_input%_*}"
          REPO_BRANCH="${source_branch_input##*_}"
          git clone -q --single-branch --depth=1 --branch=${REPO_BRANCH} ${REPO_URL} openwrt
          ln -sf /builder/openwrt ${{ github.workspace }}/openwrt
          ln -sf /builder/openwrt /home/runner/work/_actions/ophub/amlogic-s9xxx-openwrt/main/openwrt
          echo "build_tag=OpenWrt_${{ matrix.branch }}_${{ inputs.openwrt_storage }}_$(date +"%Y.%m")" >> ${GITHUB_ENV}
          echo "REPO_URL=${REPO_URL}" >> ${GITHUB_ENV}
          echo "REPO_NAME=${REPO_NAME}" >> ${GITHUB_ENV}
          echo "REPO_BRANCH=${REPO_BRANCH}" >> ${GITHUB_ENV}
          echo "status=success" >> ${GITHUB_OUTPUT}
      - name: Load custom feeds
        run: |
          [[ -f "${FEEDS_CONF}" ]] && cp -f ${FEEDS_CONF} openwrt/feeds.conf.default
          chmod +x ${DIY_P1_SH}
          cd openwrt
          ${{ github.workspace }}/${DIY_P1_SH}
      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a
      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a
      - name: Load custom config
        run: |
          [[ -d "files" ]] && mv -f files openwrt/files
          [[ -f "${CONFIG_FILE}" ]] && cp -f ${CONFIG_FILE} openwrt/.config
          chmod +x ${DIY_P2_SH}
          cd openwrt
          ${{ github.workspace }}/${DIY_P2_SH} "${{ inputs.openwrt_ip }}" "${{ inputs.use_ccache }}"
      - name: Download packages
        id: package
        run: |
          cd openwrt
          make defconfig
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;
      - name: Get OpenWrt source commit hash
        id: openwrthash
        run: |
          repo_path="$(echo "${{ env.REPO_URL }}" | awk -F"github.com/" '{print $2}')"
          api_url="https://api.github.com/repos/${repo_path}/git/ref/heads/${{ env.REPO_BRANCH }}"
          source_hash=$(curl -fsSL -m 20 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              ${api_url} | jq -r '.object.sha')
          [[ -z "${source_hash}" || "${source_hash}" == "null" ]] && source_hash="${{ github.sha }}"
          echo "source_hash=${source_hash}" >> ${GITHUB_ENV}
          echo "status=success" >> ${GITHUB_OUTPUT}
      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: /builder/openwrt/.ccache
          key: openwrt-${{ env.REPO_NAME }}-${{ env.source_hash }}
          restore-keys: |
            openwrt-${{ env.REPO_NAME }}-
      - name: Compile OpenWrt firmware
        id: compile
        run: |
          cd openwrt
          echo "Compile with $(nproc) threads"
          make -j$(( $(nproc) + 1 )) V=s || make -j1 V=s
          ccache -s 2>/dev/null
          echo "status=success" >> ${GITHUB_OUTPUT}
      # ====================== 新增：收集所有ipk并打包为gz ======================
      - name: Collect ipk packages and compress to tar.gz
        id: collect_ipk
        if: ${{ steps.compile.outputs.status == 'success' && !cancelled() }}
        run: |
          cd openwrt
          mkdir -p output/ipk_bundle
          # 复制全部编译输出的ipk包
          find bin -name "*.ipk" -exec cp {} output/ipk_bundle/ \;
          # 打包成压缩包
          tar -zcvf output/openwrt-ipks.tar.gz -C output/ipk_bundle .
          ls -lh output/
          echo "status=success" >> ${GITHUB_OUTPUT}
      # =======================================================================
      - name: Clean build workspace
        id: clean
        if: ${{ steps.compile.outputs.status == 'success' && !cancelled() }}
        run: |
          cd openwrt
          [[ -d "output" ]] || mkdir output
          cp -f bin/targets/*/*/*-generic-rootfs.tar.gz output/
          cp -f .config output/config
          ls -A | grep -vE '^(output|\.ccache)$' | xargs rm -rf || true
          df -hT ${PWD}
          echo "status=success" >> ${GITHUB_OUTPUT}
      - name: Upload OpenWrt rootfs + ipk bundle to Release
        uses: ophub/upload-to-releases@main
        if: ${{ steps.clean.outputs.status == 'success' && !cancelled() }}
        with:
          tag: ${{ env.build_tag }}
          artifacts: openwrt/output/*
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Package OpenWrt for target boards
        if: ${{ steps.clean.outputs.status == 'success' && !cancelled() }}
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: openwrt/output/*rootfs.tar.gz
          openwrt_ip: ${{ inputs.openwrt_ip }}
          openwrt_board: ${{ inputs.openwrt_board }}
          openwrt_kernel: ${{ inputs.openwrt_kernel }}
          auto_kernel: ${{ inputs.auto_kernel }}
          kernel_repo: ${{ inputs.kernel_repo }}
          kernel_usage: ${{ inputs.kernel_usage }}
          builder_name: ${{ inputs.builder_name }}
      - name: Upload packaged OpenWrt to Release
        uses: ophub/upload-to-releases@main
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        with:
          tag: ${{ env.build_tag }}
          artifacts: ${{ env.PACKAGED_OUTPUTPATH }}/*
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ### OpenWrt Image Information
            - Default IP: `192.168.1.1`
            - Default username: `root`
            - Default password: `password`
            - Default WIFI name: `OpenWrt`
            - Default WIFI password: `none`
            ### Install to EMMC
            - Login to OpenWrt → `System` → `Amlogic Service` → `Install OpenWrt`
            ### OpenWrt source code
            - [${{ env.REPO_NAME }}](${{ env.REPO_URL }}/tree/${{ env.REPO_BRANCH }})
            ### Applicable Platform
            - 🐧 `arm64`
            - 📦 IPK packages bundle: `openwrt-ipks.tar.gz`
            - 🐋 Docker image: https://hub.docker.com/u/ophub
